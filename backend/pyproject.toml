[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.17",
    "langgraph>=1.2.11",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
